name: Microservice CI/CD

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'k8s/**'

jobs:
  # ==========================================
  # JOB 1 : TESTS AUTOMATISÉS (Unit & Integration)
  # ==========================================
  test:
    name: Run Automated Tests
    runs-on: Ubuntu-latest

    steps: 
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set Up Node.js 
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: ./user-service/package-lock.json

    - name: Run Unit Tests
      run: |
        cd user-service
        npm run test:unit

    - name: Run Integration Tests
      run: |
        cd user-service
        npm run test:integration


  # ==========================================
  # JOB 2 : BUILD DOCKER & DEPLOY GITOPS
  # ==========================================
  build-and-push:
    runs-on: ubuntu-latest
    needs: test

    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.REGISTRY_USERNAME }}
        password: ${{ secrets.REGISTRY_PASSWORD }}

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: ./user-service
        file: ./user-service/Dockerfile
        push: true
        tags: |
          ${{ secrets.REGISTRY_USERNAME }}/user-service:latest
          ${{ secrets.REGISTRY_USERNAME }}/user-service:${{ github.sha }}

    - name: Update Kubernetes Manifest
      run: |
        # Remplace directement la valeur du tag image dans deployment.yaml
        sed -i 's|image: .*|image: ${{ secrets.REGISTRY_USERNAME }}/user-service:${{ github.sha }}|g' user-service/k8s/deployment.yaml
        
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        git add user-service/k8s/deployment.yaml
        
        # Vérifie s'il y a des changements avant de commiter pour éviter l'erreur "nothing to commit"
        if ! git diff --staged --quiet; then
          git commit -m "ci: update image tag to ${{ github.sha }} [skip ci]"
          git push origin main
        else
          echo "No changes in deployment.yaml to commit"
        fi
      