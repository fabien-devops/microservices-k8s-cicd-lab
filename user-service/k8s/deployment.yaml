apiVersion: apps/v1
kind: Deployment
metadata: 
  name: user-service
  namespace: default
  labels:
    app: user-service
spec:
  replicas: 2
  selector: 
    matchLabels:
      app: user-service
  template:
    metadata:
      labels: 
        app: user-service
    spec:
      containers: 
      - name: user-service
        image: user-service:latest
        # imagePullPolicy: IfNotPresent
        imagePullPolicy: Always
        ports: 
        - containerPort: 8080
        readinessProbe: 
          httpGet: 
            path: /health
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 5
        livenessProbe:
          httpGet: 
            path: /health
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata: 
  name: user-service
  namespace: default
spec:
  type: ClusterIP
  selector: 
    app: user-service
  ports:
    - port: 80
      targetPort: 8080